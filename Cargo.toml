[package]
name = "human_editor"
version = "0.1.0"
edition = "2024"
description = "Embeddable MakeHuman-derived character editor for Bevy and Avian"
license = "MIT OR Apache-2.0"

[features]
default = ["editor"]
editor = ["dep:bevy_egui", "window"]
window = ["bevy/bevy_winit", "bevy/x11"]

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_pbr", "bevy_render", "bevy_mesh", "bevy_camera", "bevy_light", "bevy_shader", "bevy_gltf", "gltf_animation", "bevy_scene", "bevy_animation", "jpeg", "bevy_gizmos", "bevy_image", "bevy_window", "png", "tonemapping_luts", "ktx2", "zstd_rust"] }
avian3d = { version = "=0.8.0", default-features = false, features = ["3d", "parry-f32"] }
bevy_egui = { version = "=0.43.1", optional = true, default-features = false, features = ["render", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4.6", features = ["derive", "env"] }
gltf = { version = "1.4", features = ["import"] }

[[bin]]
name = "human-editor"
path = "src/main.rs"
required-features = ["editor"]

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[[example]]
name = "in_game_editor"
required-features = ["editor"]

[[example]]
name = "embedded"
required-features = ["window"]
